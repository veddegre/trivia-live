services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia_live
    ports:
      - "5432:5432"
    volumes:
      - trivia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia_live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trivia:trivia@db:5432/trivia_live?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-trivia-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@localhost}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-trivia-admin}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SESSION_SECRET: ${SESSION_SECRET:-trivia-local-session-secret-change-me}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Default on for Compose so first boot has a known admin; set to 0 in prod after setup
      SUPERADMIN_BOOTSTRAP: ${SUPERADMIN_BOOTSTRAP:-1}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL:-}
    volumes:
      - trivia_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  trivia_pg:
  trivia_uploads:
