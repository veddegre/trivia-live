services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: bar_trivia
    ports:
      - "5432:5432"
    volumes:
      - trivia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d bar_trivia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trivia:trivia@db:5432/bar_trivia?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-trivia-admin}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  trivia_pg:
